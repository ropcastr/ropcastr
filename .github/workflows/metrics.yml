name: Metrics
on:
  # Executa automaticamente todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode o script manualmente quando quiser
  workflow_dispatch:
  # Executa caso haja alguma alteração na branch principal
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações de arquivo e salvamento
          filename: github-metrics.svg
          output_action: commit
          committer_branch: output
          
          # Fuso horário
          config_timezone: America/Sao_Paulo
          
          # Mantém APENAS o cabeçalho limpo (foto, seguidores e repositórios)
          base: header
          
          # Autoriza a busca de dados em organizações e colaborações (como a Fatec)
          repositories_affiliations: owner, collaborator, organization_member
          
          # Gráfico de Linguagens Usadas
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          
          # Força a exibição de todas as linguagens, mesmo as menores que 1%
          plugin_languages_threshold: 0%
          
          # Escaneamento profundo para achar seus commits em outros repositórios
          plugin_languages_indepth: yes
