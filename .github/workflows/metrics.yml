name: Metrics
on:
  # Executa automaticamente todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode o script manualmente quando quiser
  workflow_dispatch:
  # Executa caso haja alguma alteração na branch principal
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações de arquivo e salvamento na branch "output"
          filename: github-metrics.svg
          output_action: commit
          committer_branch: output
          
          # Estética e fuso horário
          config_timezone: America/Sao_Paulo
          config_theme: dark
          
          # Mantém apenas o cabeçalho limpo (Mostra Avatar, Seguidores, Repositórios e Commits totais)
          base: header
          
          # 1. Gráfico de Linguagens Usadas
          plugin_languages: yes
          plugin_languages_ignored: html, css
          plugin_languages_details: percentage, lines
          
          # 2. Gráfico de Atividades e Contribuições (Estilo "Heatmap" do GitHub)
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
          
          # 3. Gráficos de Hábitos (Mostra em quais horários e dias da semana você mais tem atividades)
          plugin_habits: yes
          plugin_habits_charts: yes
          plugin_habits_facts: no
          plugin_habits_days: 14
