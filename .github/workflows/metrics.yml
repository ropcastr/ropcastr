name: Metrics
on:
  # Executa automaticamente todo dia à meia-noite
  schedule: [{cron: "0 0 * * *"}]
  # Permite que você rode o script manualmente quando quiser
  workflow_dispatch:
  # Executa caso haja alguma alteração na branch principal
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          
          # Configurações de arquivo e salvamento na branch "output"
          filename: github-metrics.svg
          output_action: commit
          committer_branch: output
          
          # Estética e fuso horário
          config_timezone: America/Sao_Paulo
          config_theme: dark
                   
          # Restaura TODOS os dados numéricos (Atividades, Contribuições, etc.)
          base: header
                 
          # Autoriza a busca de dados em repositórios de organizações e colaborações
          repositories_affiliations: owner, collaborator, organization_member
          
          # Gráfico de Linguagens Usadas
          plugin_languages: yes
          plugin_languages_details: percentage, lines
          plugin_languages_limit: 8
          
          # Força a exibição de todas as linguagens, mesmo as que têm menos de 1% (como o Python)
          plugin_languages_threshold: 0%
          
          # O modo "indepth" força a ferramenta a contar seus commits em repositórios de terceiros
          plugin_languages_indepth: yes
